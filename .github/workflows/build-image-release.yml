name: Build Docker image release

on:
  workflow_dispatch:
  push:
    branches: [claude/sleepy-maxwell-o3lblf]
    paths: [.github/workflows/build-image-release.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: images-rocketchat-6.11.3-mongo-5.0
    steps:
      - name: Pull images
        run: |
          docker pull registry.rocket.chat/rocketchat/rocket.chat:6.11.3
          docker pull mongo:5.0

      - name: Save and zip
        run: |
          docker save -o rocketchat-6.11.3.tar registry.rocket.chat/rocketchat/rocket.chat:6.11.3
          docker save -o mongodb-5.0.tar mongo:5.0
          zip -9 rocketchat-mongodb-images.zip rocketchat-6.11.3.tar mongodb-5.0.tar
          sha256sum rocketchat-6.11.3.tar mongodb-5.0.tar rocketchat-mongodb-images.zip | tee SHA256SUMS.txt
          ls -lh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rocket.Chat 6.11.3 + MongoDB 5.0 Docker images" \
            --notes "Full docker save tarballs of registry.rocket.chat/rocketchat/rocket.chat:6.11.3 and mongo:5.0, zipped together. Unzip, then: docker load -i rocketchat-6.11.3.tar && docker load -i mongodb-5.0.tar" \
            rocketchat-mongodb-images.zip SHA256SUMS.txt
